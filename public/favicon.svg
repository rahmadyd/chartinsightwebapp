<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="12" y1="44" x2="52" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Grid lines -->
  <line x1="12" y1="48" x2="52" y2="48" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="12" y1="36" x2="52" y2="36" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="12" y1="24" x2="52" y2="24" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Subtle Bar silhouettes -->
  <rect x="16" y="38" width="6" height="10" rx="2" fill="url(#barGrad)"/>
  <rect x="26" y="32" width="6" height="16" rx="2" fill="url(#barGrad)"/>
  <rect x="36" y="24" width="6" height="24" rx="2" fill="url(#barGrad)"/>
  <rect x="46" y="18" width="6" height="30" rx="2" fill="url(#barGrad)"/>

  <!-- Glowing Trend Line -->
  <path d="M 14 44 Q 24 38 30 26 T 50 16" fill="none" stroke="url(#chartGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <!-- Data Points -->
  <circle cx="14" cy="44" r="3" fill="#38bdf8"/>
  <circle cx="30" cy="26" r="3" fill="#818cf8"/>
  <circle cx="50" cy="16" r="3.5" fill="#f43f5e" filter="url(#neonGlow)"/>

  <!-- Pulse Star / Sparkle in corner -->
  <path d="M 48 8 L 49.5 12 L 53.5 13.5 L 49.5 15 L 48 19 L 46.5 15 L 42.5 13.5 L 46.5 12 Z" fill="#38bdf8"/>
</svg>
